name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build app
        # electron-builder가 태그 감지 시 자동 publish를 시도하다 토큰 없이 실패하므로
        # publish는 끄고(Release 첨부는 아래 softprops 스텝이 담당), 빌드만 한다.
        run: npm run dist -- --publish never
        env:
          # 서명을 하지 않으므로 macOS 자동 서명 탐색을 끈다.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: ignore

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          body: |
            내 옷으로 상의·하의 조합을 만들어 룩북에 저장하는 데스크톱 앱 👕👖

            ## 다운로드 & 실행

            ### 🍎 맥 (Apple Silicon)
            1. `...-arm64-mac.zip` 다운로드 후 압축 풀기
            2. `Clothing Simulation.app` 을 `응용 프로그램` 폴더로 이동
            3. 처음 한 번은 **"앱이 손상되었기 때문에 열 수 없습니다"** 경고가 뜰 수 있어요.
               서명을 안 한 앱이라 그런 것으로, 터미널에서 아래 한 줄이면 해결됩니다 (최초 1회):
               ```
               xattr -cr "/Applications/Clothing Simulation.app"
               ```
            4. 더블클릭하면 실행됩니다 🎉

            ### 🪟 윈도우
            1. `...Setup...exe` 다운로드 후 실행
            2. "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행**
            3. 설치 후 시작 메뉴/바탕화면에서 실행 🎉

            > 자세한 사용법·데이터 저장 위치는 [README](https://github.com/haejiJang/outfit-simulation#readme) 참고
